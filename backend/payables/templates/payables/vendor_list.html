<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: Arial, sans-serif; font-size: 11px; margin: 20px; color: #1a1a2e; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .subtitle { color: #555; margin: 0 0 16px; font-size: 10px; }
  table { width: 100%; border-collapse: collapse; }
  th { background: #1a1a2e; color: white; padding: 6px 8px; text-align: left; font-size: 10px; }
  td { padding: 5px 8px; border-bottom: 1px solid #eee; }
  tr:nth-child(even) td { background: #f9f9fb; }
</style>
</head>
<body>
{% include "shared/_pdf_letterhead.html" %}
<h1>Vendors</h1>
<p class="subtitle">Active vendors</p>
<table>
  <thead>
    <tr>
      <th>Name</th><th>Email</th><th>Phone</th><th>Address</th>
    </tr>
  </thead>
  <tbody>
    {% for row in rows %}
    <tr>
      <td>{{ row.name }}</td>
      <td>{{ row.email }}</td>
      <td>{{ row.phone }}</td>
      <td>{{ row.address }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
</body>
</html>
