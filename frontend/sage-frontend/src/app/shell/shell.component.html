<div style="display:flex;height:100vh">
  <nav style="width:220px;background:#1a1a2e;color:white;padding:1rem;flex-shrink:0;position:relative">
    <h3 style="margin:0 0 1.5rem;color:#e8e8f0">Sage</h3>
    <a routerLink="/accounts" routerLinkActive="active-link"
       style="display:block;padding:.5rem;color:#b0b0c8;text-decoration:none;border-radius:4px;margin-bottom:.25rem">
      Chart of Accounts
    </a>
    <a routerLink="/journals" routerLinkActive="active-link"
       style="display:block;padding:.5rem;color:#b0b0c8;text-decoration:none;border-radius:4px;margin-bottom:.25rem">
      Journal Entries
    </a>
    <div style="position:absolute;bottom:1rem;width:188px">
      <button (click)="logout()"
        style="background:transparent;border:1px solid #555;color:#b0b0c8;padding:.375rem .75rem;border-radius:4px;cursor:pointer;width:100%">
        Sign Out
      </button>
    </div>
  </nav>
  <main style="flex:1;overflow:auto;padding:1.5rem;background:#f9f9fb">
    <router-outlet></router-outlet>
  </main>
</div>
