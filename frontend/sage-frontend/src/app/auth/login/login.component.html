<div style="display:flex;justify-content:center;align-items:center;height:100vh;background:#f5f5f5">
  <div style="background:white;padding:2rem;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.15);width:320px">
    <h2 style="margin:0 0 1.5rem;text-align:center">Sage Accounting</h2>
    <form (ngSubmit)="onSubmit()">
      <label style="display:block;margin-bottom:.25rem;font-size:.875rem">Username</label>
      <input [(ngModel)]="username" name="username" type="text" required
        style="width:100%;padding:.5rem;border:1px solid #ccc;border-radius:4px;margin-bottom:1rem;box-sizing:border-box" />
      <label style="display:block;margin-bottom:.25rem;font-size:.875rem">Password</label>
      <input [(ngModel)]="password" name="password" type="password" required
        style="width:100%;padding:.5rem;border:1px solid #ccc;border-radius:4px;margin-bottom:1rem;box-sizing:border-box" />
      @if (error) {
        <p style="color:red;font-size:.875rem;margin-bottom:.75rem">{{ error }}</p>
      }
      <button type="submit" [disabled]="loading"
        style="width:100%;padding:.625rem;background:#1a73e8;color:white;border:none;border-radius:4px;cursor:pointer;font-size:1rem">
        {{ loading ? 'Signing in…' : 'Sign In' }}
      </button>
    </form>
  </div>
</div>
