<div class="login-root">

  <!-- ── Left: brand panel ──────────────────────── -->
  <div class="brand-panel">
    <div class="geo-ring r1"></div>
    <div class="geo-ring r2"></div>
    <div class="geo-ring r3"></div>
    <div class="geo-ring r4"></div>
    <div class="geo-rect rect1"></div>
    <div class="geo-rect rect2"></div>

    <div class="panel-rule"></div>
    <div class="wordmark">Pa<span>ge</span></div>
    <div class="institution">Topfaith University</div>
    <div class="tagline">Finance System</div>

    <div class="panel-footer">Accounting &nbsp;·&nbsp; Reporting &nbsp;·&nbsp; Compliance</div>
  </div>

  <!-- ── Right: login form ──────────────────────── -->
  <div class="form-panel">
    <div class="form-container">

      <div class="form-header">
        <h1>Welcome back</h1>
        <p>Sign in to continue to Page</p>
      </div>

      <form (ngSubmit)="onSubmit()" autocomplete="on">

        <div class="field-group">
          <label for="username">Username</label>
          <input
            id="username"
            [(ngModel)]="username"
            name="username"
            type="text"
            placeholder="Enter your username"
            required
            autocomplete="username"
          />
        </div>

        <div class="field-group">
          <div class="password-label-row">
            <label for="password">Password</label>
            <a routerLink="/forgot-password" class="forgot-link">Forgot password?</a>
          </div>
          <div class="password-wrapper">
            <input
              id="password"
              [(ngModel)]="password"
              name="password"
              [type]="showPassword ? 'text' : 'password'"
              placeholder="Enter your password"
              required
              autocomplete="current-password"
            />
            <button
              type="button"
              class="password-toggle"
              (click)="showPassword = !showPassword"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            >{{ showPassword ? 'Hide' : 'Show' }}</button>
          </div>
        </div>

        @if (error) {
          <div class="error-msg">{{ error }}</div>
        }

        <button
          type="submit"
          class="submit-btn"
          [class.is-loading]="loading"
          [disabled]="loading"
        >{{ loading ? 'Signing in…' : 'Sign In' }}</button>

        <p class="signup-link">Don't have an account? <a routerLink="/signup">Create one</a></p>

      </form>
    </div>
  </div>

</div>
